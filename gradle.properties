org.gradle.jvmargs=-Xmx4096M
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# No JAVA_HOME on this machine and PATH java is 11; ForgeGradle 6 requires JDK 17
org.gradle.java.home=C:/java/java17
org.gradle.java.installations.paths=C:/java/java17

# Build environment
minecraft_version=1.20.1
forge_version=47.2.0
mapping_channel=official
mapping_version=1.20.1

# JEI (Just Enough Items) API —— 仅编译期引用，运行时不打包。
# 选 15.20.0.106：1.20.1 Forge 生态中的稳定版本，API 覆盖本项目所需接口。
jei_version=15.20.0.106

# Mod metadata
# NOTE: author / credits / description are written directly in
# src/main/resources/META-INF/mods.toml (UTF-8), because gradle.properties
# is parsed as ISO-8859-1 and would corrupt non-ASCII text.
mod_id=lolipickaxe
mod_name=LoliPickaxe Mod
mod_license=GPL-3.0-only
mod_version=1.0
mod_group_id=com.anotherstar
# Vendor string used in the jar MANIFEST only (must stay ASCII)
mod_vendor=ZHCOOL520, Is_GK
